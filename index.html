<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOPI LEK - Pratinjau</title><link id="ic" rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#F6F1E7;--ink:#17140F;--card:#fff;--c1:#BFDDF5;--c2:#FFF0A8;--c3:#E5E7EB}
body{background:var(--bg);color:var(--ink);font:15px/1.4 'DM Sans',system-ui,sans-serif;padding-bottom:90px}
.w{max-width:480px;margin:0 auto;padding:14px}
.h{font-family:'Archivo Black',sans-serif;font-weight:400}
.bx{border:3px solid var(--ink);border-radius:13px;box-shadow:4px 4px 0 var(--ink);background:var(--card)}
.b{border:2px solid var(--ink);border-radius:10px;background:var(--ink);color:var(--bg);padding:9px 14px;font:700 13px 'DM Sans',sans-serif;cursor:pointer}
.b.on{background:var(--c2);color:#111}.dg{background:#FF4D2E;color:#fff}
.top{display:flex;gap:8px;align-items:center;margin-bottom:12px}.lg{font-size:22px}
.st{font:400 11px 'Archivo Black';padding:5px 10px;border:2px solid var(--ink);border-radius:99px;margin-left:auto;color:#111}
.st.on{background:var(--c1)}.st.off{background:var(--c3)}
.ev{position:relative;padding:14px;margin-bottom:14px;background:var(--c2);color:#111}
.ev .h{font-size:19px;margin:4px 0}.tm{font-weight:700;font-size:13px}.ev p{font-size:13px;margin-top:4px}
.stk{position:absolute;right:10px;top:-11px;background:#FF4D2E;color:#fff;font:400 11px 'Archivo Black';padding:5px 10px;border:2px solid #111;border-radius:99px;animation:wob 2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(8deg) scale(1.08)}}
.mq{margin:6px -14px 14px;padding:8px 0;overflow:hidden;white-space:nowrap;transform:rotate(-2deg);font:400 13px 'Archivo Black'}
.mq div{display:inline-block;animation:r linear infinite}@keyframes r{to{transform:translateX(-50%)}}
.hr{font-size:40px;line-height:1;margin:8px 0}.jam{font-weight:700;margin-bottom:6px}
.sec{font:400 16px 'Archivo Black';margin:16px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{padding:7px;position:relative}
.im{height:96px;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-size:34px;overflow:hidden;color:#111}.im img{width:100%;height:100%;object-fit:cover}
.tags{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.tg{background:var(--c2);color:#111;font:400 9px 'Archivo Black';padding:3px 7px;border:2px solid var(--ink);border-radius:99px}
.c b{display:block;margin-top:6px;font-size:13px}.pr{font-weight:700;font-size:13px;opacity:.8}.ad{width:100%;margin-top:6px}
.bar{position:fixed;left:12px;right:12px;bottom:12px;max-width:456px;margin:auto;display:flex;justify-content:space-between;padding:14px 16px;font-size:15px}
.ov{position:fixed;inset:0;background:var(--bg);color:var(--ink);overflow:auto;z-index:9;display:none}.ov.on{display:block}
.row{padding:10px;margin-bottom:14px;display:grid;gap:6px}
input,select{width:100%;padding:9px 10px;border:2px solid var(--ink);border-radius:9px;background:var(--card);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto}input[type=color]{height:42px;padding:2px}
.ck{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:700;margin-right:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
label.l{font-size:12px;font-weight:700;display:block;margin:6px 0 2px}
.nt{font-size:12px;opacity:.75}.qr{max-width:140px;border:2px solid var(--ink);border-radius:8px}
.kb{margin-top:14px;width:100%;background:#16853C;color:#fff}.ver{text-align:center;font-size:11px;opacity:.6;margin-top:22px}
.lgo{mix-blend-mode:multiply;display:block}.dk .lgo{filter:invert(1);mix-blend-mode:screen}
.tl{height:46px;width:auto}.hl{text-align:center;margin:6px 0 2px}.hl .lgo{height:220px;max-width:100%;width:auto;margin:0 auto;object-fit:contain}.hl+.hr{font-size:30px;text-align:center}.hl+.hr+.jam{text-align:center}
.evi{margin:-14px -14px 10px;height:130px;border-bottom:3px solid var(--ink);border-radius:10px 10px 0 0;overflow:hidden;background:var(--c1)}.evi img{width:100%;height:100%;object-fit:cover;display:block}.evi.ct img{object-fit:contain;padding:8px}
@media(prefers-reduced-motion:reduce){.mq div,.stk{animation:none}}
</style></head><body>
